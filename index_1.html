<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.csvランダムスペル出題</title>
    <style>
        .panel {display: grid; gap: 8px; margin-top: 12px;}
        .container {display: flex;} /* align-items: center; を削除（デフォルトのstretchにする） */
        
        /* 各列に文字の上下中央揃えを追加 */
        .left {width: 40px; background-color: #f0f0f0; padding: 8px; box-sizing: border-box; text-align: center; display: flex; align-items: center; justify-content: center;} 
        .centor {width: 500px; background-color: #d0eaff; padding: 8px; box-sizing: border-box; display: flex; align-items: center;} 
        .centor_1 {width: 160px; background-color: #f0f0f0; padding: 8px; box-sizing: border-box;}
        .right {flex: 1; background-color: #d0eaff; padding: 8px; white-space: nowrap; box-sizing: border-box; display: flex; align-items: center;} 

        /* 入力欄の見た目を調整 */
        .centor_1 input {width: 100%; box-sizing: border-box;} 
    </style>
</head>
<body>
    <h1>.csvランダム出題</h1>

    <div class="panel">
        <input type="file" id="file" accept=".csv">
        <button onclick="sei()">問題を生成</button>
    </div>

    <!-- ここから問題エリア（行ごとに container で囲む） -->
    <div id="quiz-area" style="margin-top: 12px;">

        <!-- 1行目 -->
        <div class="container">
            <div class="left"><div id="mon_1">1</div></div>
            <div class="centor"><div id="syu_1"></div></div>
            <div class="centor_1"><input id="kai_1"></div>
            <div class="right"><div id="kot_1"></div></div>
        </div>

        <!-- 2行目 -->
        <div class="container">
            <div class="left"><div id="mon_2">2</div></div>
            <div class="centor"><div id="syu_2"></div></div>
            <div class="centor_1"><input id="kai_2"></div>
            <div class="right"><div id="kot_2"></div></div>
        </div>

        <!-- 3行目 -->
        <div class="container">
            <div class="left"><div id="mon_3">3</div></div>
            <div class="centor"><div id="syu_3"></div></div>
            <div class="centor_1"><input id="kai_3"></div>
            <div class="right"><div id="kot_3"></div></div>
        </div>

        <!-- 4行目 -->
        <div class="container">
            <div class="left"><div id="mon_4">4</div></div>
            <div class="centor"><div id="syu_4"></div></div>
            <div class="centor_1"><input id="kai_4"></div>
            <div class="right"><div id="kot_4"></div></div>
        </div>

        <!-- 5行目 -->
        <div class="container">
            <div class="left"><div id="mon_5">5</div></div>
            <div class="centor"><div id="syu_5"></div></div>
            <div class="centor_1"><input id="kai_5"></div>
            <div class="right"><div id="kot_5"></div></div>
        </div>

        <!-- 6行目 -->
        <div class="container">
            <div class="left"><div id="mon_6">6</div></div>
            <div class="centor"><div id="syu_6"></div></div>
            <div class="centor_1"><input id="kai_6"></div>
            <div class="right"><div id="kot_6"></div></div>
        </div>

        <!-- 7行目 -->
        <div class="container">
            <div class="left"><div id="mon_7">7</div></div>
            <div class="centor"><div id="syu_7"></div></div>
            <div class="centor_1"><input id="kai_7"></div>
            <div class="right"><div id="kot_7"></div></div>
        </div>

        <!-- 8行目 -->
        <div class="container">
            <div class="left"><div id="mon_8">8</div></div>
            <div class="centor"><div id="syu_8"></div></div>
            <div class="centor_1"><input id="kai_8"></div>
            <div class="right"><div id="kot_8"></div></div>
        </div>

        <!-- 9行目 -->
        <div class="container">
            <div class="left"><div id="mon_9">9</div></div>
            <div class="centor"><div id="syu_9"></div></div>
            <div class="centor_1"><input id="kai_9"></div>
            <div class="right"><div id="kot_9"></div></div>
        </div>

        <!-- 10行目 -->
        <div class="container">
            <div class="left"><div id="mon_10">10</div></div>
            <div class="centor"><div id="syu_10"></div></div>
            <div class="centor_1"><input id="kai_10"></div>
            <div class="right"><div id="kot_10"></div></div>
        </div>

    </div>

    <div class="panel">
        <button onclick="ca()">回答</button>
    </div>
    <script src="random_1.js"></script>
</body>
</html>
